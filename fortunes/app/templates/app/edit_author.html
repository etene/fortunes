{% extends "app/base.html" %}
{% load django_bootstrap5 %}

{% block toolbar %}
{% if instance %}
<ul class="navbar-nav mb-lg-0">
    <li>
        <btn class="btn btn-outline-danger me-2">
            <i class="bi bi-trash3"></i>&nbsp;Supprimer
        </btn>
    </li>
</ul>
{% endif %}
{% endblock %}


{% block content %}

<div class="row">
    <div class="col">

        <form method="post" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Enregistrer" %}
        </form>

</div>
{% endblock %}
