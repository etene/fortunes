{% extends "app/base.html" %}
{% load django_bootstrap5 %}

{% block content %}

<div class="row">
    <div class="col">

        <form action="{{ form_target }}" method="post" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Enregistrer" %}
        </form>

</div>
{% endblock %}
