{% load markdownify %}

<div class="card shadow m-3">
    <div class="card-header">
        <ul class="nav nav-pills card-header-pills">
            <li class="nav-item">
                <a class="nav-link active" href="{% url 'fortune-detail' fortune.id %}" title="Citation numéro {{ fortune.id }}">
                    <i class="bi bi-chat-quote"></i><span class="font-monospace">&nbsp;{{fortune.id }}</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true"><span class="fw-light"><i class="bi bi-calendar-event"></i>&nbsp;{{ fortune.date }}</span></a>
            </li>
            {% if fortune.hidden %}
            <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true"><span class="fw-light fst-italic"><i class="bi bi-eye-slash"></i>&nbsp;Caché</span></a>
            </li>
            {% endif %}
            <li class="nav-item ms-auto">
                <a class="btn nav-link" role="button" id="fortuneOptionsDropdownButton" data-bs-toggle="dropdown" aria-expanded="false" title="Options">
                    <i class="bi bi-gear"></i>
                </a>
                <ul class="dropdown-menu" aria-labelledby="fortuneOptionsDropdownButton">
                    <li>
                        <a class="dropdown-item" href="{% url 'fortune-edit' fortune.id %}"><i class="bi bi-pencil"></i>&nbsp;Modifier</a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="#">
                            <i class="bi bi-eye-slash"></i>&nbsp;Cacher
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item text-danger" href="{% url 'fortune-delete' fortune.id %}"><i class="bi bi-trash3"></i>&nbsp;Supprimer{% if fortune.deleted %} définitivement{% endif %}</a>
                    </li>
                </ul>
            </li>
        </ul>

    </div>


    <div class="card-body">
        <figure class="text-center">
            <blockquote class="blockquote">
                <img class="rounded float-start" src="/author/{{ fortune.author.id }}/thumbnail/" style="height: 3em;" title="Photo de {{ fortune.author.name }}"/>
                <i class="bi bi-quote"></i>&nbsp;{{ fortune.text | markdownify }}
            </blockquote>
            <figcaption class="blockquote-footer">
                <i><span class="fst-italic">{{ fortune.author.name }}{% if fortune.author_age %}, {{ fortune.author_age }} ans{% endif %}</span></i>
            </figcaption>
        </figure>
        {% if display_images %}
    </div>
    <!-- <div class="card-body m-2"> -->
        <img src="{% url 'random-image' fortune_id=fortune.id %}" class="card-img-bottom"
            title="{{ fortune.author.name }} en {{ fortune.date.year }}">
    <!-- </div> -->
    {% endif %}
</div>
