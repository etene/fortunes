<div class="modal fade" tabindex="-1" id="fortuneDeleteModal" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmer la suppression</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Annuler"></button>
      </div>
      <div class="modal-body">
        <p>Voulez vous supprimer la citation #<a href="/{{ instance.id }}/">{{ instance.id }}</a> ?</p>
        {% if instance.deleted %}
        <p class="text-warning">Elle est déjà à la corbeille, cette action est donc définitive.</p>
        {% else %}
        <p class="text-muted">Elle sera placée dans la corbeille d'où vous pourrez la restaurer si besoin.</p>
        {% endif %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Non</button>
        <button type="button" class="btn btn-danger">Supprimer la citation</button>
      </div>
    </div>
  </div>
</div>
