<div class="modal fade" tabindex="-1" id="fortuneDeleteModal" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Annuler"></button>
      </div>
      <div class="modal-body">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Non</button>
        <form action="#" method="post">
          {% csrf_token %}
          <input type="submit" class="btn btn-danger" id="fortuneDeleteButton" name="fortuneDeleteButton" value="Supprimer la citation"/>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
var fortuneDeleteModal = document.getElementById('fortuneDeleteModal')
fortuneDeleteModal.addEventListener('show.bs.modal', function (event) {
  var button = event.relatedTarget
  var fortune_id = button.getAttribute('data-bs-fortune-id')
  var deleted = button.getAttribute("data-bs-fortune-deleted") === "True"
  var modalTitle = fortuneDeleteModal.querySelector('.modal-title')
  modalTitle.textContent = "Confirmer la suppression" 
  var modalBody = fortuneDeleteModal.querySelector('.modal-body')
  modalBody.innerText = ""
  var confirmMessage = document.createElement("p")
  confirmMessage.appendChild(new Text("Voulez vous supprimer la citation #"))
  confirmMessageLink = document.createElement("a")
  confirmMessageLink["href"] = `/${fortune_id}/`
  confirmMessageLink.textContent = fortune_id
  confirmMessage.appendChild(confirmMessageLink)
  confirmMessage.appendChild(new Text(" ?"))
  modalBody.appendChild(confirmMessage)
  var confirmExtra = document.createElement("p")
  if (deleted) {
      modalTitle.textContent += " définitive"
      confirmExtra.className = "text-warning"
      confirmExtra.innerText = "Elle est déjà à la corbeille, cette action est donc définitive."
    } else {
        confirmExtra.className = "text-muted"
        confirmExtra.innerText = "Elle sera placée dans la corbeille d'où vous pourrez la restaurer si besoin."
    }
    modalBody.appendChild(confirmExtra)
    var deleteBtnForm = fortuneDeleteModal.querySelector(".modal-footer").querySelector("form")
    deleteBtnForm["action"] = `/${fortune_id}/delete/`
})

</script>
